name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js with built-in npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'       

      # 3. Setup Java environment (Required for Android builds)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Install Project Dependencies
      - name: Install Dependencies
        run: npm ci 

      # 5. Global setup for Expo CLI tools
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 6. Generate the native Android directory (Prebuild)
      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      # 7. Compile and build the actual APK
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 8. Upload the generated APK as a downloadable run artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drc-virtual-golf-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7 
