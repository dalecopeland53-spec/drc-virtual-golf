name: Deploy Tour Pro Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Export Web Application Static Assets
        run: npx expo export --platform web

      - name: Upload Static Web Bundle Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Live Project Link to Web
        id: deployment
        uses: actions/deploy-pages@v4
