name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        run: npm ci
      - name: Verify or repair approved DRC Android icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib
          p=Path('drc-virtual-golf-icon.png')
          b=p.read_bytes() if p.exists() else b''
          sig=b'\x89PNG\r\n\x1a\n'
          if not b.startswith(sig):
              raise SystemExit('DRC icon missing or not a PNG')
          i=8; chunks=[]; saw_iend=False
          while i<len(b):
              if i+12>len(b): raise SystemExit('DRC icon truncated before chunk header')
              n=struct.unpack('>I',b[i:i+4])[0]; typ=b[i+4:i+8]; end=i+12+n
              if end>len(b): raise SystemExit('DRC icon truncated inside PNG chunk')
              data=b[i+8:i+8+n]
              chunks.append((typ,data))
              i=end
              if typ==b'IEND': saw_iend=True; break
          if not saw_iend: raise SystemExit('DRC icon missing IEND chunk')
          out=bytearray(sig)
          repaired=False
          j=8
          for typ,data in chunks:
              n=len(data); crc=zlib.crc32(typ+data)&0xffffffff
              old=struct.unpack('>I',b[j+8+n:j+12+n])[0]
              if old!=crc: repaired=True
              out+=struct.pack('>I',n)+typ+data+struct.pack('>I',crc)
              j+=12+n
          if repaired:
              p.write_bytes(out)
              print('Approved DRC icon CRCs repaired in build workspace; pixel data unchanged')
          else:
              print('Approved DRC icon verified')
          # final integrity check
          rb=p.read_bytes(); k=8; ok=False
          while k<len(rb):
              n=struct.unpack('>I',rb[k:k+4])[0]; typ=rb[k+4:k+8]; end=k+12+n
              if end>len(rb): break
              data=rb[k+8:k+8+n]; crc=struct.unpack('>I',rb[k+8+n:k+12+n])[0]
              if (zlib.crc32(typ+data)&0xffffffff)!=crc: break
              k=end
              if typ==b'IEND': ok=True; break
          if not ok: raise SystemExit('DRC icon still invalid after CRC repair')
          PY
          file drc-virtual-golf-icon.png
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Embed production JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify standalone bundle is packaged
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
