name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    name: Package Standalone Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Required for modern React Native / Expo Gradle builds

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Direct Core Project Dependencies
        run: npm install

      - name: Install Global EAS Command Tool
        run: npm install -g eas-cli

      - name: Package Standalone Android App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # Seamless non-interactive auth
          EAS_NO_VCS: 1 # Disables strict Git/VCS tracking that fails on CI runners
          EXPO_DEBUG: true # Exposes full logging details if anything crashes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          eas build --platform android --profile preview --local --non-interactive --output=$GITHUB_WORKSPACE/app-preview.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: app-preview.apk
          retention-days: 7
