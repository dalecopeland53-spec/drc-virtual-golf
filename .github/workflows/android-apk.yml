name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install clean dependency tree
        run: |
          npm install
          CI=1 npx expo install --fix

      - name: Expo configuration check
        run: npx expo config --type public >/dev/null

      - name: Generate clean native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Embed production JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK contains offline bundle
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'

      - name: Name finished APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DRC-Virtual-Golf-Elite.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-Elite-APK
          path: DRC-Virtual-Golf-Elite.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f virtual-golf-latest "$GITHUB_SHA"
          git push origin refs/tags/virtual-golf-latest --force
          if gh release view virtual-golf-latest >/dev/null 2>&1; then
            gh release upload virtual-golf-latest DRC-Virtual-Golf-Elite.apk --clobber
            gh release edit virtual-golf-latest --title "DRC Virtual Golf Elite - Latest Android APK" --notes "Clean native DRC Virtual Golf Elite Android build."
          else
            gh release create virtual-golf-latest DRC-Virtual-Golf-Elite.apk --title "DRC Virtual Golf Elite - Latest Android APK" --notes "Clean native DRC Virtual Golf Elite Android build." --latest
          fi
