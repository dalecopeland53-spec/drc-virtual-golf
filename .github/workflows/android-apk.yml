name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    name: Package Standalone Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Required for modern React Native / Expo Gradle builds

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Speeds up subsequent workflow runs

      - name: Install Direct Core Project Dependencies
        run: npm install

      - name: Install Global EAS Command Tool
        run: npm install -g eas-cli

      - name: Package Standalone Android App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # Authenticates the CLI seamlessly in non-interactive mode
        run: eas build --platform android --profile preview --local --non-interactive --output=./app-preview.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: ./app-preview.apk
          retention-days: 7 # Kept for a week before auto-deleting
