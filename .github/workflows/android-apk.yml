name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    name: Package Standalone Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Direct Core Project Dependencies
        run: npm install

      - name: Install Global EAS Command Tool
        run: npm install -g eas-cli

      - name: Package Standalone Android App
        run: eas build --platform android --profile preview --local --non-interactive
