name: Build Android APK (Expo Local)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install dependencies
      run: npm install

    # Added --no-install to prevent the workflow from hanging or breaking on the server
    - name: Generate Native Android Directory
      run: npx expo prebuild --platform android --no-install

    - name: Build Android APK via Gradle
      run: |
        cd android
        ./gradlew assembleRelease

    # This will cleanly upload your standalone offline APK
    - name: Upload Finished APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: drc-golf-elite-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
