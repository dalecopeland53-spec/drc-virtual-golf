name: DRC Clean Android APK

on:
  workflow_dispatch:
  push:
    branches: ["clean-rebuild-20260910"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        run: npm ci
      - name: Expo config check
        run: npx expo config --type public
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Embed production JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew clean assembleRelease --no-daemon
      - name: Verify new clean bundle
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
          test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload clean APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-CLEAN-v2
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
