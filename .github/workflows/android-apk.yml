name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        run: npm ci
      - name: Verify approved DRC Android icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib
          p=Path('drc-virtual-golf-icon.png')
          b=p.read_bytes() if p.exists() else b''
          if not b.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('DRC icon missing or invalid PNG')
          i=8; ok=False
          while i<len(b):
              if i+12>len(b): break
              n=struct.unpack('>I',b[i:i+4])[0]; typ=b[i+4:i+8]; end=i+12+n
              if end>len(b): break
              data=b[i+8:i+8+n]; crc=struct.unpack('>I',b[i+8+n:i+12+n])[0]
              if (zlib.crc32(typ+data)&0xffffffff)!=crc: break
              i=end
              if typ==b'IEND': ok=True; break
          if not ok: raise SystemExit('DRC icon failed PNG integrity check')
          print('Approved DRC icon verified — no fallback substitution allowed')
          PY
          file drc-virtual-golf-icon.png
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Embed production JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify standalone bundle is packaged
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
