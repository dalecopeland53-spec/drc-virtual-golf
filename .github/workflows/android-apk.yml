name: Build Android APK (Expo Local)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm' # Speeds up subsequent runs by caching dependencies

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle' # Speeds up subsequent runs by caching Gradle dependencies

    - name: Install dependencies
      run: npm install

    - name: Generate Native Android Directory
      run: npx expo prebuild --platform android --no-install

    - name: Build Android APK via Gradle
      run: |
        cd android
        ./gradlew assembleRelease

    # This step uses a search pattern to guarantee your APK is found and packaged
    - name: Upload Finished APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: drc-golf-elite-apk
        path: android/app/build/outputs/apk/**/*.apk
        if-no-files-found: error # This forces the build to fail explicitly if no APK was created
