name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install locked dependencies
        run: npm ci

      - name: Repair app icon PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert drc-virtual-golf-icon.png -strip PNG32:drc-virtual-golf-icon-fixed.png
          mv drc-virtual-golf-icon-fixed.png drc-virtual-golf-icon.png

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Embed production JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify standalone bundle is packaged
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
