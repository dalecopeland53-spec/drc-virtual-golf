name: DRC Clean Android APK

on:
  workflow_dispatch:
  push:
    branches: ["clean-rebuild-20260910"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        run: npm ci
      - name: Expo config check
        run: npx expo config --type public
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Embed production JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Replace broken bundled icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          targets=[]
          roots=[Path('android/app/src/main/res'),Path('android/app/build/generated/res/react/release')]
          for root in roots:
              if root.exists():
                  targets += list(root.rglob('drcvirtualgolficon.png'))
          if not targets:
              raise SystemExit('drcvirtualgolficon.png not found after bundle')
          for p in targets:
              p.parent.mkdir(parents=True,exist_ok=True)
              im=Image.new('RGBA',(256,256),(242,245,248,255))
              d=ImageDraw.Draw(im)
              d.ellipse((28,28,228,228),outline=(7,59,120,255),width=14,fill=(255,255,255,255))
              d.ellipse((104,104,152,152),fill=(8,120,209,255))
              im.save(p,format='PNG',optimize=False,compress_level=6)
              print('replaced',p)
          PY
      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew clean assembleRelease --no-daemon
      - name: Verify new clean bundle
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
          test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload clean APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-CLEAN-v2
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
