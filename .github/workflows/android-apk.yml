name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install locked dependencies
        run: npm ci

      - name: Repair and verify DRC icon PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib
          p=Path('drc-virtual-golf-icon.png')
          b=p.read_bytes()
          sig=b'\x89PNG\r\n\x1a\n'
          if not b.startswith(sig): raise SystemExit('DRC icon is not a PNG')
          out=bytearray(sig); i=8; chunks=0
          while i < len(b):
              if i+12>len(b): raise SystemExit('Truncated PNG chunk header')
              n=struct.unpack('>I',b[i:i+4])[0]
              typ=b[i+4:i+8]
              end=i+12+n
              if end>len(b): raise SystemExit(f'Truncated PNG chunk {typ!r}')
              data=b[i+8:i+8+n]
              out += struct.pack('>I',n)+typ+data+struct.pack('>I',zlib.crc32(typ+data)&0xffffffff)
              chunks += 1; i=end
              if typ==b'IEND': break
          if not out.endswith(b'IEND\xaeB`\x82'): raise SystemExit('PNG has no valid IEND')
          p.write_bytes(out)
          print(f'DRC icon CRCs repaired across {chunks} chunks')
          PY
          file drc-virtual-golf-icon.png

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Embed production JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify standalone bundle is packaged
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
