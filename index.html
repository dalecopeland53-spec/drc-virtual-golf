<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>DRC Virtual Golf</title>

  <meta name="theme-color" content="#03081e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta name="apple-mobile-web-app-title" content="DRC Virtual Golf" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #03081e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding:
        max(16px, env(safe-area-inset-top))
        15px
        max(20px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 60px 1fr 80px;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 28px;
    }

    .brand-title {
      color: #d4af37;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1px;
    }

    .brand-sub {
      color: #64a8ff;
      font-size: 11px;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .score {
      color: #ffcc00;
      font-weight: 700;
      text-align: right;
      font-size: 14px;
    }

    .environment-bar {
      background: #0b1536;
      padding: 12px 8px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
      font-size: 13px;
      border: 1px solid #1e2d5a;
      line-height: 1.7;
    }

    .main-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: #0b1536;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #1e2d5a;
    }
